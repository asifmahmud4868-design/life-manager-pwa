<!DOCTYPE html>
<html lang="b
n">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; color: #1f2937; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 rounded-xl text-white font-bold flex items-center justify-center">
                LM
            </div>
            <span class="text-xl font-bold text-gray-900">LifeManager</span>
        </div>

        <div id="user-section" class="hidden flex items-center space-x-4">
            <img id="user-photo" src="" alt="User" class="w-9 h-9 rounded-full border border-gray-300">
            <span id="user-name" class="font-medium text-gray-700 text-sm"></span>
            <button id="btn-logout" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-semibold">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6 flex justify-center items-center">

        <!-- Login Card -->
        <div id="login-card" class="bg-white max-w-md w-full p-8 rounded-3xl shadow-xl border border-gray-100 text-center space-y-6">
            <div class="space-y-2">
                <h2 class="text-2xl font-bold text-gray-900">Welcome to LifeManager</h2>
                <p class="text-gray-500 text-sm">Turn your goals into daily wins. Keep habits and tasks in one workspace.</p>
            </div>

            <button id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition flex items-center justify-center space-x-3">
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-card" class="hidden w-full max-w-4xl bg-white p-8 rounded-3xl border border-gray-200 shadow-sm space-y-6">
            <h1 class="text-3xl font-bold text-gray-900">Turn your goals into daily wins.</h1>
            <p class="text-gray-500">Welcome to your dashboard! Firebase Authentication is working.</p>
        </div>

    </main>

    <footer class="p-4 text-center text-gray-400 text-xs border-t border-gray-200 bg-white">
        &copy; 2026 LifeManager. All rights reserved.
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe_OU6xzh6ut_dBPvvlrVr5C",
            authDomain: "life-manager-app-471d8.firebaseapp.com",
            projectId: "life-manager-app-471d8",
            storageBucket: "life-manager-app-471d8.firebasestorage.app",
            messagingSenderId: "64873524692",
            appId: "1:64873524692:web:b369064b0fb8ed41953a41"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginCard = document.getElementById('login-card');
        const dashboardCard = document.getElementById('dashboard-card');
        const loginBtn = document.getElementById('btn-login');
        const logoutBtn = document.getElementById('btn-logout');
        const userSection = document.getElementById('user-section');
        const userName = document.getElementById('user-name');
        const userPhoto = document.getElementById('user-photo');

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                alert("Login Error: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginCard.classList.add('hidden');
                dashboardCard.classList.remove('hidden');
                userSection.classList.remove('hidden');

                userName.textContent = user.displayName || user.email;
                userPhoto.src = user.photoURL || 'https://via.placeholder.com/40';
            } else {
                loginCard.classList.remove('hidden');
                dashboardCard.classList.add('hidden');
                userSection.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
