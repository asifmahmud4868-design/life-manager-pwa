<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Life Manager</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<meta name="theme-color" content="#4f46e5">
	<style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="pb-24">
	<div id="login-screen" class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
		<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-200 mb-6">
			<i data-lucide="sparkles" class="w-8 h-8 text-white"></i>
		</div>
		<h1 class="text-3xl font-bold text-gray-900 text-center mb-2">AI Life Manager</h1>
		<p class="text-gray-500 text-center mb-8 max-w-xs">Manage your daily routines, expenses &amp; progress in one place.</p>
		<button id="btn-login" class="flex items-center gap-3 bg-white border border-gray-300 rounded-xl px-6 py-3.5 shadow-sm hover:shadow-md transition text-gray-700 font-semibold text-sm">
			<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
			Sign in with Google
		</button>
	</div>

	<div id="app-screen" class="hidden min-h-screen">
		<header class="bg-white border-b border-gray-100 px-6 py-4 sticky top-0 z-40 flex items-center justify-between">
			<div class="flex items-center gap-3"><img id="user-photo" src="" alt="Profile" class="w-9 h-9 rounded-full border border-gray-200"><div><h2 id="user-name" class="font-bold text-gray-900 text-sm">...</h2><p class="text-xs text-gray-400">Welcome back!</p></div></div>
			<button id="btn-logout" class="p-2 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-50 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
		</header>
		<main class="p-6 max-w-lg mx-auto space-y-6">
			<div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white shadow-lg shadow-indigo-100"><p class="text-indigo-100 text-xs uppercase font-bold tracking-wider mb-1">Today's Focus</p><h3 class="text-xl font-bold mb-3">All routines look good!</h3><div class="flex items-center justify-between text-xs bg-white/10 rounded-xl p-3 backdrop-blur-sm"><span>Routine Done: 0/0</span><span>Spent Today: ৳0</span></div></div>
			<div class="grid grid-cols-2 gap-4"><div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div><div><h4 class="font-bold text-gray-800 text-sm">Routines</h4><p class="text-xs text-gray-400">Track tasks</p></div></div><div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center"><i data-lucide="wallet" class="w-5 h-5"></i></div><div><h4 class="font-bold text-gray-800 text-sm">Expenses</h4><p class="text-xs text-gray-400">Track money</p></div></div></div>
		</main>
	</div>
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
		import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
		const app = initializeApp({apiKey:"AIzaSyDe_OU6xzh6ut_dBPvvlrVr5C",authDomain:"life-manager-app-471d8.firebaseapp.com",projectId:"life-manager-app-471d8",storageBucket:"life-manager-app-471d8.firebasestorage.app",messagingSenderId:"64873524692",appId:"1:64873524692:web:b369064b0fb8e",measurementId:"G-19HD2EPHRB"});
		const auth = getAuth(app), provider = new GoogleAuthProvider(), loginScreen = document.getElementById('login-screen'), appScreen = document.getElementById('app-screen'), userName = document.getElementById('user-name'), userPhoto = document.getElementById('user-photo');
		onAuthStateChanged(auth, user => { loginScreen.classList.toggle('hidden', !!user); appScreen.classList.toggle('hidden', !user); if (user) { userName.textContent = user.displayName || 'User'; userPhoto.src = user.photoURL || 'https://via.placeholder.com/40'; } });
		document.getElementById('btn-login').addEventListener('click', async () => { try { await signInWithPopup(auth, provider); } catch (error) { alert('Login failed: ' + error.message); } });
		document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
		lucide.createIcons();
	</script>
</body>
</html>
